[project]
name = "nem-battery-arbitrage"
version = "0.1.0"
description = "How much is a price forecast worth? Battery arbitrage in Australia's National Electricity Market."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pulp>=2.8,<4", "requests>=2.31", "matplotlib>=3.8", "lightgbm>=4.5", "statsmodels>=0.14"]

[project.scripts]
nem-battery = "nem_battery.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nem_battery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PuLP 3.x announces its 4.0 API; the dependency is capped below 4.
filterwarnings = ["ignore::DeprecationWarning:pulp.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
