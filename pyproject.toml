[project]
name = "nem-battery-arbitrage"
version = "0.1.0"
description = "How much is a price forecast worth? Battery arbitrage in Australia's National Electricity Market."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pulp>=2.8,<4", "requests>=2.31", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nem_battery"]
